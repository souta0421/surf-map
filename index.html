<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surf Wave Info Map</title>
  <style>
    #map { height: 100vh; width: 100%; }
    body, html { margin: 0; padding: 0; height: 100%; }
    .info-window { font-family: sans-serif; font-size: 14px; line-height: 1.5; }
    .info-window h3 { margin: 0 0 8px 0; color: #0077be; }
  </style>
</head>
<body>

  <div id="map"></div>

  <script>
    // surforestなどを参考に拡張した日本全国の主要サーフポイント（25箇所）
    const surfSpots = [
      // 北海道・東北
      { name: "北海道 / 浜厚真", lat: 42.6042, lng: 141.8317 },
      { name: "岩手 / 浪板海岸", lat: 39.3813, lng: 141.9442 },
      { name: "宮城 / 仙台新港", lat: 38.2683, lng: 141.0208 },
      { name: "福島 / 北泉海岸", lat: 37.6083, lng: 141.0317 },

      // 関東（茨城・千葉・神奈川）
      { name: "茨城 / 大洗海岸", lat: 36.3156, lng: 140.5878 },
      { name: "茨城 / 鹿島（下津）", lat: 35.9733, lng: 140.6761 },
      { name: "千葉北 / 銚子・片貝", lat: 35.5367, lng: 140.4578 },
      { name: "千葉北 / 一宮海岸", lat: 35.3785, lng: 140.3844 },
      { name: "千葉南 / 勝浦・部原", lat: 35.1436, lng: 140.3239 },
      { name: "千葉南 / 千倉海岸", lat: 34.9583, lng: 139.9611 },
      { name: "湘南 / 鵠沼海岸", lat: 35.3139, lng: 139.4678 },
      { name: "湘南 / 辻堂海岸", lat: 35.3181, lng: 139.4442 },
      { name: "湘南 / 茅ヶ崎サザンビーチ", lat: 35.3189, lng: 139.4008 },
      { name: "西湘 / 湯河原吉浜", lat: 35.1458, lng: 139.1189 },

      // 中部（伊豆・静岡・愛知）
      { name: "伊豆 / 多々戸浜", lat: 34.6644, lng: 138.9483 },
      { name: "静岡 / 静波海岸", lat: 34.7297, lng: 138.2258 },
      { name: "静岡 / 御前崎", lat: 34.6025, lng: 138.2272 },
      { name: "伊良湖 / 赤羽根港海岸（ロングビーチ）", lat: 34.6067, lng: 137.2189 },

      // 近畿・四国
      { name: "和歌山 / 磯ノ浦", lat: 34.2575, lng: 135.1017 },
      { name: "徳島 / 宍喰海岸", lat: 33.5622, lng: 134.3075 },
      { name: "高知 / 生見海岸", lat: 33.5439, lng: 134.2981 },

      // 九州・沖縄
      { name: "福岡 / 芥屋（糸島）", lat: 33.6067, lng: 130.1225 },
      { name: "宮崎 / 木崎浜", lat: 31.8239, lng: 131.4489 },
      { name: "宮崎 / 青島海岸", lat: 31.8028, lng: 131.4789 },
      { name: "沖縄 / スーサイドポイント", lat: 26.0911, lng: 127.6975 }
    ];

    function initMap() {
      // 全体がほどよく見えるように日本の中心付近をセット
      const map = new google.maps.Map(document.getElementById("map"), {
        zoom: 6,
        center: { lat: 36.5000, lng: 138.0000 },
      });

      const infoWindow = new google.maps.InfoWindow();

      surfSpots.forEach(spot => {
        const marker = new google.maps.Marker({
          position: { lat: spot.lat, lng: spot.lng },
          map: map,
          title: spot.name,
        });

        marker.addListener("click", () => {
          infoWindow.setContent(`<div class="info-window"><b>${spot.name}</b><br>波情報を読み込み中...</div>`);
          infoWindow.open(map, marker);

          fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${spot.lat}&longitude=${spot.lng}&current=wave_height,wave_direction,wave_period&timezone=Asia%2FTokyo`)
            .then(res => res.json())
            .then(data => {
              const waveHeight = data.current.wave_height ?? "データなし";
              const wavePeriod = data.current.wave_period ?? "データなし";

              infoWindow.setContent(`
                <div class="info-window">
                  <h3>🌊 ${spot.name}</h3>
                  <p><b>波高:</b> ${waveHeight} m</p>
                  <p><b>周期:</b> ${wavePeriod} 秒</p>
                </div>
              `);
            })
            .catch(err => {
              infoWindow.setContent(`<div class="info-window"><b>${spot.name}</b><br>データの取得に失敗しました</div>`);
            });
        });
      });
    }
  </script>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCYVTUZVysaxNdrSLT-u0cvuGGqwxRTwYc&callback=initMap" async defer></script>
</body>
</html>
