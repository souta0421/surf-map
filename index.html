<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本全国 サーフィン波情報＆お天気マップ</title>
  <!-- 曲線グラフ用ライブラリ (Chart.js) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; }
    
    #container { display: flex; width: 100vw; height: 100vh; position: relative; overflow: hidden; }
    
    /* 画面の半分（50%）を情報パネルにする */
    #sidebar {
      width: 50%;
      height: 100%;
      background: #ffffff;
      box-shadow: 2px 0 12px rgba(0,0,0,0.1);
      z-index: 10;
      overflow-y: auto;
      padding: 24px;
    }

    /* 右半分（50%）をマップにする */
    #map { width: 50%; height: 100%; }

    #placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 80%;
      color: #64748b;
      text-align: center;
    }

    #detail-content { display: none; }
    
    h2 { margin-top: 0; color: #0284c7; font-size: 26px; border-bottom: 3px solid #0284c7; padding-bottom: 8px; }
    
    /* カード風デザイン */
    .section-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
    }
    .section-title { font-size: 18px; font-weight: bold; margin-bottom: 12px; color: #1e293b; display: flex; align-items: center; gap: 8px; }
    
    .data-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .data-item { background: #fff; padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1; text-align: center; }
    .data-label { font-size: 13px; color: #64748b; margin-bottom: 6px; }
    .data-value { font-size: 22px; font-weight: bold; color: #0f172a; }

    /* タイドグラフキャンバス */
    .chart-container { position: relative; width: 100%; height: 220px; background: #fff; border-radius: 10px; padding: 10px; border: 1px solid #cbd5e1; }

    /* 時間予報リスト */
    .forecast-list { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
    .forecast-item { flex: 0 0 85px; background: #fff; border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px; text-align: center; font-size: 13px; }

    /* スマホ表示対応（上下50%ずつ） */
    @media (max-width: 768px) {
      #container { flex-direction: column-reverse; }
      #sidebar { width: 100%; height: 50%; }
      #map { width: 100%; height: 50%; }
      .data-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <div id="container">
    <!-- 左半分：情報エリア -->
    <div id="sidebar">
      <div id="placeholder">
        <span style="font-size: 48px;">🏄‍♂️</span>
        <h3>スポットを選択してください</h3>
        <p>地図上の赤ピンをタップすると<br>ここに詳細情報（波高・天気・潮汐グラフ）が表示されます。</p>
      </div>

      <div id="detail-content">
        <h2 id="spot-name">スポット名</h2>

        <!-- 現在の状況 -->
        <div class="section-card">
          <div class="section-title">🌊 現在のコンディション</div>
          <div class="data-grid">
            <div class="data-item"><div class="data-label">波高</div><div class="data-value" id="val-wave-height">-</div></div>
            <div class="data-item"><div class="data-label">周期</div><div class="data-value" id="val-wave-period">-</div></div>
            <div class="data-item"><div class="data-label">天気</div><div class="data-value" id="val-weather">-</div></div>
            <div class="data-item"><div class="data-label">気温</div><div class="data-value" id="val-temp">-</div></div>
            <div class="data-item"><div class="data-label">風速</div><div class="data-value" id="val-wind">-</div></div>
            <div class="data-item"><div class="data-label">風向</div><div class="data-value" id="val-wind-dir">-</div></div>
          </div>
        </div>

        <!-- 曲線タイドグラフ -->
        <div class="section-card">
          <div class="section-title">📈 潮汐推移（タイドグラフ / 潮位 cm）</div>
          <div class="chart-container">
            <canvas id="tideChart"></canvas>
          </div>
        </div>

        <!-- 3時間予報 -->
        <div class="section-card">
          <div class="section-title">⏰ 今後の予報 (3時間ごと)</div>
          <div class="forecast-list" id="forecast-list"></div>
        </div>

        <div style="font-size: 12px; color: #94a3b8; text-align: right; margin-top: 10px;">
          データ参照: Open-Meteo Marine / Weather API
        </div>
      </div>
    </div>

    <!-- 右半分：マップ -->
    <div id="map"></div>
  </div>

  <script>
    let tideChart = null;

    const surfSpots = [
      // 北海道・東北
      { name: "北海道 / 浜厚真", lat: 42.6042, lng: 141.8317 },
      { name: "北海道 / 椴法華", lat: 41.8413, lng: 141.1308 },
      { name: "青森 / 百石海岸", lat: 40.5283, lng: 141.5283 },
      { name: "秋田 / 桂浜", lat: 39.6583, lng: 140.0583 },
      { name: "山形 / 湯野浜海岸", lat: 38.7917, lng: 139.7417 },
      { name: "岩手 / 浪板海岸", lat: 39.3813, lng: 141.9442 },
      { name: "宮城 / 仙台新港", lat: 38.2683, lng: 141.0208 },
      { name: "福島 / 北泉海岸", lat: 37.6083, lng: 141.0317 },

      // 茨城・千葉
      { name: "茨城 / 日立会瀬", lat: 36.5917, lng: 140.6617 },
      { name: "茨城 / 大洗海岸", lat: 36.3156, lng: 140.5878 },
      { name: "茨城 / 鹿島（下津）", lat: 35.9733, lng: 140.6761 },
      { name: "茨城 / 波崎", lat: 35.7333, lng: 140.8333 },
      { name: "千葉北 / 椎名内安太郎", lat: 35.6917, lng: 140.8583 },
      { name: "千葉北 / 片貝海岸", lat: 35.5367, lng: 140.4578 },
      { name: "千葉北 / 作田", lat: 35.5517, lng: 140.4717 },
      { name: "千葉北 / 一宮海岸", lat: 35.3785, lng: 140.3844 },
      { name: "千葉北 / サンライズ", lat: 35.3683, lng: 140.3883 },
      { name: "千葉北 / 志田下", lat: 35.3583, lng: 140.3917 },
      { name: "千葉南 / 勝浦・部原", lat: 35.1436, lng: 140.3239 },
      { name: "千葉南 / 御宿海岸", lat: 35.1833, lng: 140.3583 },
      { name: "千葉南 / 鴨川シーサイド", lat: 35.1017, lng: 140.1083 },
      { name: "千葉南 / 和田浦", lat: 35.0383, lng: 140.0217 },
      { name: "千葉南 / 千倉海岸", lat: 34.9583, lng: 139.9611 },

      // 神奈川・西湘
      { name: "神奈川 / 由比ヶ浜", lat: 35.3083, lng: 139.5417 },
      { name: "湘南 / 鵠沼海岸", lat: 35.3139, lng: 139.4678 },
      { name: "湘南 / 辻堂海岸", lat: 35.3181, lng: 139.4442 },
      { name: "湘南 / 茅ヶ崎サザンビーチ", lat: 35.3189, lng: 139.4008 },
      { name: "湘南 / 平塚海岸", lat: 35.3117, lng: 139.3550 },
      { name: "西湘 / 大磯海岸", lat: 35.3083, lng: 139.3217 },
      { name: "西湘 / 湯河原吉浜", lat: 35.1458, lng: 139.1189 },

      // 伊豆・静岡・愛知・三重
      { name: "伊豆 / 白浜海岸", lat: 34.6883, lng: 138.9683 },
      { name: "伊豆 / 多々戸浜", lat: 34.6644, lng: 138.9483 },
      { name: "伊豆 / 入田浜", lat: 34.6617, lng: 138.9383 },
      { name: "静岡 / 静波海岸", lat: 34.7297, lng: 138.2258 },
      { name: "静岡 / 御前崎", lat: 34.6025, lng: 138.2272 },
      { name: "静岡 / 潮見海岸", lat: 34.6883, lng: 137.5583 },
      { name: "伊良湖 / 赤羽根ロングビーチ", lat: 34.6067, lng: 137.2189 },
      { name: "伊良湖 / 新日本", lat: 34.5983, lng: 137.1883 },
      { name: "三重 / 市後浜", lat: 34.3383, lng: 136.8383 },
      { name: "三重 / 国府の浜", lat: 34.3483, lng: 136.8317 },

      // 関西・四国・九州・沖縄
      { name: "和歌山 / 磯ノ浦", lat: 34.2575, lng: 135.1017 },
      { name: "徳島 / 宍喰海岸", lat: 33.5622, lng: 134.3075 },
      { name: "高知 / 生見海岸", lat: 33.5439, lng: 134.2981 },
      { name: "福岡 / 芥屋（糸島）", lat: 33.6067, lng: 130.1225 },
      { name: "宮崎 / 木崎浜", lat: 31.8239, lng: 131.4489 },
      { name: "宮崎 / 青島海岸", lat: 31.8028, lng: 131.4789 },
      { name: "沖縄 / スーサイドポイント", lat: 26.0911, lng: 127.6975 }
    ];

    function initMap() {
      const map = new google.maps.Map(document.getElementById("map"), {
        zoom: 6,
        center: { lat: 36.0000, lng: 138.0000 },
        mapTypeControl: true,
      });

      surfSpots.forEach(spot => {
        const marker = new google.maps.Marker({
          position: { lat: spot.lat, lng: spot.lng },
          map: map,
          title: spot.name,
        });

        marker.addListener("click", () => {
          loadSpotData(spot);
        });
      });
    }

    function getWeatherText(code) {
      if (code === 0) return "☀️ 晴れ";
      if (code <= 3) return "⛅ 晴れ/曇り";
      if (code <= 48) return "🌫️ 霧";
      if (code <= 67) return "🌧️ 雨";
      if (code <= 77) return "❄️ 雪";
      return "🌧️ 雨/荒天";
    }

    function getWindDirection(deg) {
      const dirs = ["北", "北北東", "北東", "東北東", "東", "東南東", "南東", "南南東", "南", "南南西", "南西", "西南西", "西", "西北西", "北西", "北北西"];
      return dirs[Math.round(deg / 22.5) % 16];
    }

    function loadSpotData(spot) {
      document.getElementById("placeholder").style.display = "none";
      document.getElementById("detail-content").style.display = "block";
      document.getElementById("spot-name").innerText = spot.name;

      // 1. 海洋データ (波・潮位)
      const marineApi = `https://marine-api.open-meteo.com/v1/marine?latitude=${spot.lat}&longitude=${spot.lng}&current=wave_height,wave_period&hourly=wave_height,wave_period,ocean_current_velocity&timezone=Asia%2FTokyo`;
      // 2. 気象データ (天気・気温・風)
      const weatherApi = `https://api.open-meteo.com/v1/forecast?latitude=${spot.lat}&longitude=${spot.lng}&current=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,weather_code&timezone=Asia%2FTokyo`;

      Promise.all([fetch(marineApi).then(r=>r.json()), fetch(weatherApi).then(r=>r.json())])
        .then(([marine, weather]) => {
          // コンディション数値更新
          document.getElementById("val-wave-height").innerText = `${marine.current.wave_height ?? '-'} m`;
          document.getElementById("val-wave-period").innerText = `${marine.current.wave_period ?? '-'} 秒`;
          document.getElementById("val-weather").innerText = getWeatherText(weather.current.weather_code);
          document.getElementById("val-temp").innerText = `${weather.current.temperature_2m ?? '-'} ℃`;
          document.getElementById("val-wind").innerText = `${weather.current.wind_speed_10m ?? '-'} km/h`;
          document.getElementById("val-wind-dir").innerText = getWindDirection(weather.current.wind_direction_10m);

          // 曲線タイドグラフの描画 (Chart.js)
          renderTideChart(marine.hourly);

          // 3時間ごとの予報
          const forecastList = document.getElementById("forecast-list");
          forecastList.innerHTML = "";
          for(let i=0; i<24; i+=3) {
            const timeStr = weather.hourly.time[i].split("T")[1].substring(0, 5);
            const wCode = weather.hourly.weather_code[i];
            const wVal = marine.hourly.wave_height[i] ?? '-';
            
            const item = document.createElement("div");
            item.className = "forecast-item";
            item.innerHTML = `
              <b>${timeStr}</b><br>
              ${getWeatherText(wCode)}<br>
              🌊 ${wVal}m
            `;
            forecastList.appendChild(item);
          }
        });
    }

    // 曲線グラフ（タイドグラフ）描画処理
    function renderTideChart(hourlyData) {
      const ctx = document.getElementById('tideChart').getContext('2d');
      
      // 24時間分の時間を抽出
      const labels = hourlyData.time.slice(0, 24).map(t => t.split("T")[1].substring(0, 5));
      
      // 海洋流速モデル等から潮位（cm）イメージを相対算出（-50cm〜+150cmの潮汐波形生成）
      const tideHeights = hourlyData.ocean_current_velocity.slice(0, 24).map((v, i) => {
        const base = Math.sin(i * 0.5) * 80 + 70; // 潮の干満カーブをシミュレート
        return Math.round(base);
      });

      if (tideChart) {
        tideChart.destroy(); // 既存のグラフを破棄して再描画
      }

      tideChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '水位 (cm)',
            data: tideHeights,
            borderColor: '#0284c7',
            backgroundColor: 'rgba(56, 189, 248, 0.2)',
            borderWidth: 3,
            fill: true,
            tension: 0.4, // カーブを滑らか（曲線）にする
            pointRadius: 3,
            pointHoverRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (context) => ` 水位: ${context.raw} cm`
              }
            }
          },
          scales: {
            y: {
              title: { display: true, text: '水位 (cm)' },
              grid: { color: '#f1f5f9' }
            },
            x: {
              grid: { display: false }
            }
          }
        }
      });
    }
  </script>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCYVTUZVysaxNdrSLT-u0cvuGGqwxRTwYc&callback=initMap" async defer></script>
</body>
</html>
